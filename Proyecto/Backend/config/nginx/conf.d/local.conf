upstream srv_app-caseta {
    server app-caseta:8000;
}

server {
    listen 80;
    server_name localhost;

    location /static {
        autoindex off;
        alias /static/;
    }
    location / {
        proxy_pass http://srv_app-caseta;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}