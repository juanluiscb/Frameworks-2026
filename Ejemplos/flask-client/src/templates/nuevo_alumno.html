<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Alumno</title>
    <!-- Incluir Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="card-title">Registrar Nuevo Alumno</h3>
        </div>
        <div class="card-body">
            <form action="guarda-alumno" method="POST">
                <!-- Nombre Apellidos Paterno y Materno-->
                 <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="nombre" class="form-label">Nombre(s)</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Juan" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="apaterno" class="form-label">Apellido Paterno</label>
                        <input type="text" class="form-control" id="apaterno" name="apaterno" placeholder="Pérez">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="amaterno" class="form-label">Apellido Materno</label>
                        <input type="text" class="form-control" id="amaterno" name="amaterno" placeholder="Hernández">
                    </div>
                </div>

                <!-- Matricula , Edad y Género en la misma fila -->
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="matricula" class="form-label">Matrícula</label>
                        <input type="number" class="form-control" id="matricula" name="matricula" min="0" max="99999999" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="edad" class="form-label">Edad</label>
                        <input type="number" class="form-control" id="edad" name="edad" min="0" max="666" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="genero" class="form-label">Género</label>
                        <select class="form-select" id="genero" name="genero" required>
                            <option selected disabled value="">Seleccionar...</option>
                            <option value="OTRO">OTRO</option>
                            <option value="HOMBRE">HOMBRE</option>
                            <option value="MUJER">MUJER</option>
                        </select>
                    </div>
                </div>
                <div>
                <!-- Correo Electrónico -->
                    <label for="email">Correo Electrónico</label>
                    <input type="text" class="form-control" id="email" name="email" required>
                </div>

                <!-- Activo/Inactivo -->
                <div class="mb-3 form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="activo" name="activo" checked>
                    <label class="form-check-label" for="activo">Alumno Activo</label>
                </div>

                <!-- Botones -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="submit" class="btn btn-primary">Guardar Alumno</button>
                    <a href="javascript:history.back()" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Incluir Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
